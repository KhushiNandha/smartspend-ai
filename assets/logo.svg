<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Hexagon / Shield -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#primaryGrad)" filter="url(#glow)" />
  <rect x="7" y="7" width="86" height="86" rx="22" fill="#0F172A" />
  
  <!-- Glowing Growth Chart Lines -->
  <path d="M 22 68 L 40 50 L 55 60 L 78 30" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="78,22 84,33 70,32" fill="#38BDF8" />
  
  <!-- Stylized Rupee / Sparkle Symbol in Center Left -->
  <circle cx="40" cy="50" r="4" fill="#10B981" />
  <circle cx="55" cy="60" r="4" fill="#38BDF8" />
  <circle cx="78" cy="30" r="5" fill="#34D399" />
  
  <!-- AI Sparkle in upper corner -->
  <path d="M 30 25 Q 35 25 35 20 Q 35 25 40 25 Q 35 25 35 30 Q 35 25 30 25 Z" fill="#F59E0B" />
</svg>
